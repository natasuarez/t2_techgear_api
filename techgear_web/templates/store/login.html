<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en TechGear para gestionar tu cuenta y tus compras tecnológicas.">
    <title>Iniciar Sesión - TechGear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold text-dark">⚡ TechGear</h1>
                        <p class="text-muted small">Inicia sesión en tu cuenta</p>
                    </div>

                    <!-- Mensajes de feedback -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show small" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="correo" class="form-label fw-semibold small">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold rounded-3 mb-3 shadow-sm">Iniciar Sesión</button>
                    </form>

                    <div class="text-center">
                        <p class="small text-muted mb-0">¿No tienes cuenta? <a href="{% url 'register' %}" class="text-decoration-none fw-semibold text-primary">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
